org.gradle.jvmargs=-Xmx4g -Dfile.encoding=UTF-8
org.gradle.caching=true
android.useAndroidX=true
kotlin.code.style=official

# Unity Ads anahtarlari (Unity Monetization paneli > Apps > uygulaman).
# UNITY_GAME_ID: Android Game ID (sadece rakamlar). Bos iken release derlenmez.
# Reklam birimleri (Ad Units / Placements): Unity'nin varsayilan Android adlari asagida.
# Panelde farkli adla olusturduysan buraya onu yaz. Bos birakilan reklam gosterilmez.
UNITY_GAME_ID=
UNITY_BANNER_ID=Banner_Android
UNITY_INTERSTITIAL_ID=Interstitial_Android
UNITY_REWARDED_ID=Rewarded_Android
